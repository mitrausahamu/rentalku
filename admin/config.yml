backend:
  name: github
  repo: mitrausahamu/rentalku
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "cars"
    label: "Armada Mobil"
    folder: "src/content/cars"
    create: true
    fields:
      - {label: "Nama Mobil", name: "title", widget: "string"}
      - {label: "Harga Sewa", name: "price", widget: "string"}
      - {label: "Foto Mobil", name: "image", widget: "image"}
      - {label: "Meta Title (SEO)", name: "meta_title", widget: "string"}
      - {label: "Meta Description (SEO)", name: "meta_description", widget: "text"}
      - {label: "Deskripsi", name: "body", widget: "markdown"}

  - name: "articles"
    label: "Artikel SEO"
    folder: "src/content/articles"
    create: true
    fields:
      - {label: "Judul Artikel", name: "title", widget: "string"}
      - {label: "Tanggal", name: "date", widget: "date"}
      - {label: "Meta Title (SEO)", name: "meta_title", widget: "string"}
      - {label: "Meta Description (SEO)", name: "meta_description", widget: "text"}
      - {label: "Isi Artikel", name: "body", widget: "markdown"}
